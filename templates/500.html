{% extends "base.html" %}

{% block title %}Server Error - ExplainDengue{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="mb-8">
            <div class="w-32 h-32 bg-gradient-to-r from-red-500 to-orange-600 rounded-full flex items-center justify-center mx-auto mb-8">
                <i data-feather="alert-triangle" class="w-16 h-16 text-white"></i>
            </div>
            <h1 class="text-6xl font-bold text-gray-900 mb-4">500</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Server Error</h2>
            <p class="text-gray-600 mb-8">
                Something went wrong on our end. Please try again later.
            </p>
        </div>
        
        <div class="space-y-4">
            <button onclick="location.reload()" 
                    class="btn-primary text-white px-8 py-3 rounded-xl font-semibold inline-flex items-center justify-center w-full">
                <i data-feather="refresh-cw" class="w-5 h-5 mr-2"></i>
                Try Again
            </button>
            <a href="{{ url_for('index') }}" 
               class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-8 py-3 rounded-xl font-semibold inline-flex items-center justify-center w-full transition-all">
                <i data-feather="home" class="w-5 h-5 mr-2"></i>
                Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
