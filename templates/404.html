<!-- templates/404.html -->
{% extends "base.html" %}

{% block title %}Page Not Found - ExplainDengue{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="mb-8">
            <div class="w-32 h-32 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-8">
                <i data-feather="search" class="w-16 h-16 text-white"></i>
            </div>
            <h1 class="text-6xl font-bold text-gray-900 mb-4">404</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Page Not Found</h2>
            <p class="text-gray-600 mb-8">
                The page you're looking for doesn't exist or has been moved.
            </p>
        </div>
        
        <div class="space-y-4">
            <a href="{{ url_for('index') }}" 
               class="btn-primary text-white px-8 py-3 rounded-xl font-semibold inline-flex items-center justify-center w-full">
                <i data-feather="home" class="w-5 h-5 mr-2"></i>
                Go Home
            </a>
            <a href="{{ url_for('dashboard') }}" 
               class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-8 py-3 rounded-xl font-semibold inline-flex items-center justify-center w-full transition-all">
                <i data-feather="bar-chart-2" class="w-5 h-5 mr-2"></i>
                View Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
